name: Build Full NEON RUSH 3D APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout uploaded source parts
        uses: actions/checkout@v5

      - name: Reassemble and unpack full project archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(assets.part-*)
          if [ "${#parts[@]}" -lt 2 ]; then
            echo "Expected split archive parts named assets.part-00, assets.part-01, etc. Found: ${#parts[@]}"
            exit 1
          fi
          printf '%s\n' "${parts[@]}" | sort -V | while read -r f; do cat "$f"; done > /tmp/neon-full.zip
          unzip -tq /tmp/neon-full.zip
          mkdir -p /tmp/neon-full
          unzip -oq /tmp/neon-full.zip -d /tmp/neon-full
          if [ ! -f /tmp/neon-full/project.godot ]; then
            project_file="$(find /tmp/neon-full -maxdepth 3 -name project.godot -print -quit)"
            if [ -z "$project_file" ]; then
              echo "project.godot not found in uploaded archive"
              exit 1
            fi
            cp -a "$(dirname "$project_file")/." .
          else
            cp -a /tmp/neon-full/. .
          fi
          test -f project.godot
          test -f export_presets.cfg
          echo "Full project files restored."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Install Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo install -m 0755 Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate project
        run: |
          godot --headless --editor --path . --quit --verbose 2>&1 | tee import.log

      - name: Export signed/debug APK
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --path . --export-debug "Android" build/NEON_RUSH_3D_FULL.apk --verbose 2>&1 | tee export.log
          test -s build/NEON_RUSH_3D_FULL.apk
          file build/NEON_RUSH_3D_FULL.apk

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-RUSH-3D-FULL-Android
          path: build/NEON_RUSH_3D_FULL.apk
          if-no-files-found: error
