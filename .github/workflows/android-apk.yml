name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo install -m 0755 Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Diagnose Android export configuration
        run: |
          echo "=== Godot editor settings ==="
          cat "$HOME/.config/godot/editor_settings-4.tres"
          echo "=== Android SDK components ==="
          ls -la "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/platforms/android-34" "$ANDROID_HOME/build-tools/34.0.0"
          echo "=== Godot export templates ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "=== Import project with verbose diagnostics ==="
          godot --headless --editor --path . --quit --verbose 2>&1 | tee import.log

      - name: Export APK
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --path . --export-debug "Android" build/NEON_RUSH_3D.apk --verbose 2>&1 | tee export.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEON-RUSH-3D-Android
          path: build/NEON_RUSH_3D.apk
          if-no-files-found: error
